name: review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none

      - name: Self-test (fixtures)
        run: bash tests/run-validate.sh

      - name: Validate real submissions
        run: php tools/validate.php plugins

      # Signal maintainers when the trusted-publisher keyring changes — these PRs
      # (new public keys / revocations) get extra scrutiny.
      - name: Flag publisher-onboarding changes
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number }
            );
            const touchesKeyring = files.some(f => f.filename === 'trusted-keys.json');
            if (touchesKeyring) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pull_number,
                labels: ['publisher-onboarding'],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: 'This PR modifies `trusted-keys.json` (the trusted-publisher keyring). '
                  + 'Labeled `publisher-onboarding` — a maintainer must verify the key owner '
                  + 'out-of-band before merging.',
              });
            }
